name: Publish and validate send controls
on:
  push:
    branches: [codex/mixer-console]
    paths:
      - '.github/send-controls-stage/**'
      - '.github/workflows/send-controls-materialize.yml'
permissions:
  contents: write
concurrency:
  group: send-controls-materialize
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'ibotpafos/my-daw' && github.ref == 'refs/heads/codex/mixer-console'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      # GitHub's workflow token can write code, not workflow files.
      # Workflow-file update/removal is a separate authorized connector operation.
      - name: Apply exact code changes and remove payload
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/mixer-console
          test "$(git ls-remote origin refs/heads/codex/mixer-console | cut -f1)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 4cf43224fe7be0c6087367e2300165fed275f4ef HEAD
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, subprocess
          parts = sorted(Path('.github/send-controls-stage').glob('part-*.b64'))
          if [p.name for p in parts] != [f'part-{i}.b64' for i in range(3)]:
              raise SystemExit('Unexpected payload parts')
          text = ''.join(p.read_text().strip() for p in parts)
          if len(text) != 25320: raise SystemExit('Wrong encoded length')
          data = lzma.decompress(base64.b64decode(text, validate=True))
          if len(data) != 76488 or hashlib.sha256(data).hexdigest() != '9ec89272a91f33ca76c045594d3a446fee067fabae9095f4d7c50458fd221779':
              raise SystemExit('Patch checksum mismatch')
          patch = Path('/tmp/send-controls.patch'); patch.write_bytes(data)
          args = ['git','apply','--index','--unidiff-zero','--exclude=.github/workflows/mixer.yml']
          subprocess.run(args+['--check',str(patch)],check=True)
          subprocess.run(args+[str(patch)],check=True)
          PY
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 31
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          git rm .github/send-controls-stage/part-*.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(mixer): persist send mute and independent balance with smoothed live controls'
          git push origin HEAD:refs/heads/codex/mixer-console
          mkdir -p validation
          git rev-parse HEAD | tee validation/revision.txt
          git show --stat --oneline HEAD > validation/change-summary.txt
          git archive --format=tar.gz HEAD > validation/source.tar.gz
      - name: Native mixer and send controls tests
        if: always() && steps.publish.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          bash scripts/test-mixer-ui.sh 2>&1 | tee validation/appkit-tests.log
      - name: Sanitized core build
        id: core
        if: always() && steps.publish.outcome == 'success'
        shell: bash
        run: |
          set -eo pipefail
          cmake --preset sanitizers 2>&1 | tee validation/configure.log
          cmake --build --preset sanitizers -j 2 2>&1 | tee validation/core-build.log
      - name: Full core regression including send audio exports
        if: always() && steps.core.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          ctest --preset sanitizers --output-on-failure 2>&1 | tee validation/ctest.log
      - name: Complete signed arm64 application
        if: always() && steps.publish.outcome == 'success'
        shell: bash
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
        run: |
          set -eo pipefail
          bash scripts/build-macos.sh 2>&1 | tee validation/app-build.log
          ditto -c -k --sequesterRsrc --keepParent 'build/My DAW.app' validation/My-DAW-app.zip
      - name: Documentation and public ABI coverage contracts
        if: always() && steps.publish.outcome == 'success'
        shell: bash
        run: |
          set -eo pipefail
          python3 scripts/check_docs.py 2>&1 | tee validation/docs.log
          python3 scripts/e2e_coverage.py --strict 2>&1 | tee validation/e2e-coverage.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: send-controls-native-${{ github.run_id }}
          path: |
            validation/
            build/mixer-ui.png
            build/mixer-routing-ui.png
            build/mixer-send-ui.png
            build/build-manifest.json
          retention-days: 7
