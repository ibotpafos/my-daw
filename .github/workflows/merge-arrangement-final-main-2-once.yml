name: Merge latest main into arrangement final once
on:
  push:
    branches:
      - codex/stage-arrangement-final-main-2-20260918
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Merge latest main
        shell: bash
        run: |
          set -euo pipefail
          feature=8790b6c7b5308a3b2acfba70e7083a602070f144
          git config user.name "ibotpafos"
          git config user.email "73589290+ibotpafos@users.noreply.github.com"
          git fetch origin main codex/arrangement-mixed-clipboard
          git checkout -B arrangement-final "$feature"
          mkdir -p .git/info
          printf '%s\n' 'cmake/DawTests.cmake merge=union' > .git/info/attributes
          git merge --no-ff origin/main -m "merge(main): include latest test registration changes"
          if grep -nE '^(<<<<<<<|=======|>>>>>>>)' cmake/DawTests.cmake; then
            echo "Conflict markers remain" >&2
            exit 1
          fi
          git diff --check HEAD^1..HEAD
          git push origin HEAD:refs/heads/codex/arrangement-mixed-clipboard
