name: Diagnose integration with current main
on:
  push:
    branches: [codex/midi-only-export-ui]
    paths: [.github/workflows/integration-current-main.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve structural files with ours and probe mixer UI patch
        shell: bash
        run: |
          set -u
          git config user.name integration-diagnostic
          git config user.email integration@example.invalid
          git fetch origin main
          result=0
          git merge --no-ff --no-commit acbd0439799f0cf3c9137e84deab5cc053fa4144 || result=$?
          test "$result" -eq 1
          for path in CMakeLists.txt apps/macos/main.swift scripts/build-macos.sh scripts/typecheck-macos-ui.sh; do
            git checkout --ours -- "$path"
            git add "$path"
          done
          git diff 176aeb314983295fcf234915ac97de362d567607 acbd0439799f0cf3c9137e84deab5cc053fa4144 -- apps/macos/main.swift > /tmp/mixer-main.patch
          set +e
          git apply --reject --whitespace=nowarn /tmp/mixer-main.patch
          apply_result=$?
          set -e
          printf 'main_patch_exit=%s\n' "$apply_result"
          find apps/macos -name '*.rej' -print -exec cat {} \;
          printf '%s\n' '--- remaining conflict markers ---'
          grep -R -n '^<<<<<<<\|^=======\|^>>>>>>>' CMakeLists.txt apps/macos/main.swift scripts/build-macos.sh scripts/typecheck-macos-ui.sh || true
          printf '%s\n' '--- resulting status ---'
          git status --short
          test "$apply_result" -eq 0
