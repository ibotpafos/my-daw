name: Prepare core audio device selection
on:
  push:
    branches: [codex/stage-core-audio-device-selection]
    paths: [.github/workflows/stage-core-audio.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      BASE: 660c0e442c898c68f0e57bf52cbece6360b84e13
      TARGET: codex/core-audio-device-selection
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reproduce the exact locally checked change
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git rev-parse "$BASE^{tree}")" = b83b312058593099c837c895303204065f697a9d
          for sha in a1a3c9daa5b26a0d737c9cba40cf8b723ccb3463 54240bf8cebcab69dc58670e4a291b898ff5e303; do
            curl --fail --silent --show-error --retry 2 -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/ibotpafos/my-daw/git/blobs/$sha" -o "$RUNNER_TEMP/$sha.json"
          done
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          parts = []
          for sha in ['a1a3c9daa5b26a0d737c9cba40cf8b723ccb3463', '54240bf8cebcab69dc58670e4a291b898ff5e303']:
              obj = json.loads((root / (sha + '.json')).read_text())
              assert obj['encoding'] == 'base64'
              part = base64.b64decode(obj['content'])
              assert hashlib.sha1(b'blob '+str(len(part)).encode()+b'\0'+part).hexdigest() == sha
              parts.append(part)
          patch = lzma.decompress(b''.join(parts))
          assert hashlib.sha256(patch).hexdigest() == '625ad25a6062a1e85da709a292e2b54e389023903c9063d39cbc6a376078a96c'
          (root / 'core.patch').write_bytes(patch)
          PY
          git checkout --detach "$BASE"
          git apply --unidiff-zero --index --check "$RUNNER_TEMP/core.patch"
          git apply --unidiff-zero --index "$RUNNER_TEMP/core.patch"
          test "$(git write-tree)" = 4b638db51a900bfdda5dbd3a20cfc5e88c347255
          test ! -e .github/workflows/stage-core-audio.yml
          git diff --cached --check
      - name: Format the existing bridge and validate Linux core
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format-18 libsamplerate0-dev pkg-config
          clang-format-18 -i engine/bridge/daw.cpp
          git diff -- engine/bridge/daw.cpp > "$RUNNER_TEMP/evidence/formatting-only.diff"
          git add engine/bridge/daw.cpp
          git diff --cached --check
          clang-format-18 --dry-run --Werror engine/bridge/daw.cpp engine/domain/session.cpp engine/storage/storage.cpp
          cmake --preset sanitizers
          cmake --build --preset sanitizers --parallel 2 2>&1 | tee "$RUNNER_TEMP/evidence/build.log"
          ctest --preset sanitizers 2>&1 | tee "$RUNNER_TEMP/evidence/test.log"
          python3 -m unittest discover -s tests -p test_project_layout.py -v
          python3 scripts/e2e_coverage.py --strict
      - name: Publish only the new feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test -z "$(git ls-remote origin "refs/heads/$TARGET")"
          git diff --cached "$BASE" --exit-code -- .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(audio): explicit device UIDs and hardware channel routing with native settings'
          test "$(git rev-parse HEAD^)" = "$BASE"
          printf '%s\n' '#!/bin/sh' 'case "$1" in *Username*) echo x-access-token ;; *) printf "%s\n" "$GH_TOKEN" ;; esac' > "$RUNNER_TEMP/askpass.sh"
          chmod 700 "$RUNNER_TEMP/askpass.sh"
          trap 'rm -f "$RUNNER_TEMP/askpass.sh"' EXIT
          GIT_ASKPASS="$RUNNER_TEMP/askpass.sh" GIT_TERMINAL_PROMPT=0 git push origin "HEAD:refs/heads/$TARGET"
          git rev-parse HEAD HEAD^{tree} | tee "$RUNNER_TEMP/evidence/candidate.txt"
          git archive --format=tar HEAD -o "$RUNNER_TEMP/evidence/source.tar"
          git diff --stat "$BASE" HEAD | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Preserve reproducible source and validation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: core-audio-preparation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/evidence
            build/sanitizers/ctest.xml
            build/sanitizers/Testing/Temporary/LastTest.log
          retention-days: 7
          if-no-files-found: warn
