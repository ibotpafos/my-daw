name: Stage workspace navigation refinement
on:
  push:
    branches: ["codex/reference-workspace"]
    paths: [".github/workflows/stage-workspace-navigation.yml"]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'ibotpafos/my-daw' && github.ref == 'refs/heads/codex/reference-workspace'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply checksummed source patch without changing other branches
        run: |
          test "$(git rev-parse HEAD^)" = '611e999d6ce947b64aaed72d1bf483c6f3dd6848'
          python3 - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          encoded = ''
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'b7e478ad3a7ebbc66091d8657e88e0985f9b3fd8d6bd6c9cc0f4882100dba18d'
          Path('/tmp/workspace-navigation.patch').write_bytes(patch)
          PY
          git apply --check --index /tmp/workspace-navigation.patch
          git apply --index /tmp/workspace-navigation.patch
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 9
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(macos): activate ruler navigation and refine workspace density'
          git push origin HEAD:refs/heads/codex/reference-workspace
