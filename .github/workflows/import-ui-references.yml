name: Import original UI references
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  import:
    if: github.repository == 'ibotpafos/my-daw' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/ui-design-references'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/ui-design-references
          persist-credentials: true
      - name: Verify and import the original PNG bytes
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, struct, urllib.request
          from pathlib import Path
          root = Path('docs/design/references/general-digits')
          manifest = json.loads((root / 'manifest.json').read_text())
          expected = {entry['name']: entry for entry in manifest['files']}
          assert len(expected) == 17 and manifest['screen_count'] == 16
          def valid(data, entry):
              return (len(data) == entry['bytes'] and hashlib.sha256(data).hexdigest() == entry['sha256']
                      and data[:8] == b'\x89PNG\r\n\x1a\n'
                      and struct.unpack('>II', data[16:24]) == (entry['width'], entry['height']))
          if all((root / name).is_file() and valid((root / name).read_bytes(), item) for name,item in expected.items()):
              print('All 17 original PNGs already verified; no changes needed.')
              raise SystemExit(0)
          # Exact short-lived sourceUri values returned for the 17 original images.
          # No account credential, rendered thumbnail or arbitrary URL is accepted.
          sources = {
              '00_contact_sheet.png': 'https://oaisdmntprnortheu.blob.core.windows.net/files/00000000-d548-81f4-ad81-7cb1c5381109/raw?se=2026-09-18T07%3A07%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=01a0b324-4716-7b03-899d-01a02003a946&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T03%3A39%3A06Z&ske=2026-09-19T03%3A39%3A06Z&sks=b&skv=2026-02-06&sig=nDOK72vEO0FGlmZ4vg1BZjFdvl%2BWQK4paKnH%2BiuprSY%3D',
              '01_arrange.png': 'https://oaisdmntprdenmarkeast.blob.core.windows.net/files/00000000-d030-8210-a525-c5aa4c8316c6/raw?se=2026-09-18T07%3A07%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=01a0b324-4716-7b03-899d-01a02003a946&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T06%3A46%3A04Z&ske=2026-09-19T06%3A46%3A04Z&sks=b&skv=2026-02-06&sig=XywsifkDb9B3XKqUxnDruf3EQAhudSHepcj5O5HlZ/c%3D',
              '02_mixer.png': 'https://oaisdmntprnortheu.blob.core.windows.net/files/00000000-7454-81f4-b575-b95091e30a91/raw?se=2026-09-18T07%3A07%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=01a0b324-4716-7b03-899d-01a02003a946&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T04%3A26%3A56Z&ske=2026-09-19T04%3A26%3A56Z&sks=b&skv=2026-02-06&sig=Mr0%2BkPiNNubbq5OTIAMwmE%2BUr9lnjEGeVZziESb4Xuw%3D',
              '03_piano_roll.png': 'https://oaisdmntprdenmarkeast.blob.core.windows.net/files/00000000-f4c4-8210-85be-8275e35b5a68/raw?se=2026-09-18T07%3A07%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=01a0b324-4716-7b03-899d-01a02003a946&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T04%3A58%3A21Z&ske=2026-09-19T04%3A58%3A21Z&sks=b&skv=2026-02-06&sig=1y3sgnVg5PRsQUXsFfAFKCnwUFN1a5pLmOuouXKzipE%3D',
              '04_vocal_comping.png': 'https://oaisdmntprdenmarkeast.blob.core.windows.net/files/00000000-a214-8210-ad5c-14bb06b5a6ae/raw?se=2026-09-18T07%3A07%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=01a0b324-4716-7b03-899d-01a02003a946&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T04%3A26%3A55Z&ske=2026-09-19T04%3A26%3A55Z&sks=b&skv=2026-02-06&sig=OnOFCv1lNwDO%2BBdzpaJHrMA7Sx9bxRN7g79u0ei6WSY%3D',
              '05_audio_editor.png': 'https://oaisdmntprukwest.blob.core.windows.net/files/00000000-073c-8243-a3d8-c3993e5999c4/raw?se=2026-09-18T07%3A07%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=01a0b324-4716-7b03-899d-01a02003a946&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T06%3A04%3A31Z&ske=2026-09-19T06%3A04%3A31Z&sks=b&skv=2026-02-06&sig=rge8XPaAZqzIw5fHH9i%2BWDr0xHGvJz7AQ4ue1Bm%2BcJc%3D',
              '06_pitch_editor.png': 'https://oaisdmntprdenmarkeast.blob.core.windows.net/files/00000000-712c-8210-881d-2a47c421aa77/raw?se=2026-09-18T07%3A07%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=01a0b324-4716-7b03-899d-01a02003a946&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T06%3A46%3A04Z&ske=2026-09-19T06%3A46%3A04Z&sks=b&skv=2026-02-06&sig=nNZXjuPMdqXLp2PuZNuzsBVnIpe1SmqpppQQy3wq9/Q%3D',
              '07_drum_editor.png': 'https://oaisdmntprdenmarkeast.blob.core.windows.net/files/00000000-4000-8210-bd82-24a15120ceb0/raw?se=2026-09-18T07%3A07%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=01a0b324-4716-7b03-899d-01a02003a946&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T18%3A22%3A29Z&ske=2026-09-18T18%3A22%3A29Z&sks=b&skv=2026-02-06&sig=yF4jWsjdUVzXmpugg0u9agj2FQC/YeeF/hyaD4/6omM%3D',
              '08_sampler.png': 'https://oaisdmntprdenmarkeast.blob.core.windows.net/files/00000000-bfa0-8210-8d9c-7f29b361caef/raw?se=2026-09-18T07%3A07%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=01a0b324-4716-7b03-899d-01a02003a946&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T05%3A42%3A18Z&ske=2026-09-19T05%3A42%3A18Z&sks=b&skv=2026-02-06&sig=lJJ1bYfKFxogyEJxZJXBBQFfuoI616aKy3QzauxhscY%3D',
              '09_automation_editor.png': 'https://oaisdmntprdenmarkeast.blob.core.windows.net/files/00000000-16c4-8210-a471-84a066556dbb/raw?se=2026-09-18T07%3A07%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=01a0b324-4716-7b03-899d-01a02003a946&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T06%3A04%3A26Z&ske=2026-09-19T06%3A04%3A26Z&sks=b&skv=2026-02-06&sig=myJoeiV7fXLuOYzDwnbWyY1mDB2htDzJUVTADMZZgDs%3D',
              '10_plugin_rack.png': 'https://oaisdmntprdenmarkeast.blob.core.windows.net/files/00000000-54cc-8210-a7f9-5d3b3eb8ffd9/raw?se=2026-09-18T07%3A07%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=01a0b324-4716-7b03-899d-01a02003a946&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T05%3A17%3A28Z&ske=2026-09-19T05%3A17%3A28Z&sks=b&skv=2026-02-06&sig=JbdCHZGPViSsCoN2m4116ngADEXwgvDYve%2Bk4jhlY/M%3D',
              '11_routing.png': 'https://oaisdmntpritalynorth.blob.core.windows.net/files/00000000-dd0c-8246-87f0-37bc3f62df3d/raw?se=2026-09-18T07%3A07%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=01a0b324-4716-7b03-899d-01a02003a946&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T02%3A07%3A57Z&ske=2026-09-19T02%3A07%3A57Z&sks=b&skv=2026-02-06&sig=VMcidoSTCyERQUmgTSbel6W1eg/kAsjiHkApo8h763U%3D',
              '12_browser.png': 'https://oaisdmntprdenmarkeast.blob.core.windows.net/files/00000000-87d8-8210-a7fc-d1ca3f03e030/raw?se=2026-09-18T07%3A07%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=01a0b324-4716-7b03-899d-01a02003a946&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T04%3A26%3A55Z&ske=2026-09-19T04%3A26%3A55Z&sks=b&skv=2026-02-06&sig=YbcI8vZuztgiYYz0fofxn3zDsOwrqZPu5E0m7RE3duM%3D',
              '13_mastering.png': 'https://oaisdmntprdenmarkeast.blob.core.windows.net/files/00000000-b07c-8210-ba2d-f883b78d0d8a/raw?se=2026-09-18T07%3A07%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=01a0b324-4716-7b03-899d-01a02003a946&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T06%3A46%3A04Z&ske=2026-09-19T06%3A46%3A04Z&sks=b&skv=2026-02-06&sig=U7LC9IghuUOesD27vh4/ge8XlFJeUw%2Bexr1LAzJkZhg%3D',
              '14_export_center.png': 'https://oaisdmntprdenmarkeast.blob.core.windows.net/files/00000000-dab4-8210-8d83-1fa4a7e787b8/raw?se=2026-09-18T07%3A07%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=01a0b324-4716-7b03-899d-01a02003a946&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T06%3A46%3A04Z&ske=2026-09-19T06%3A46%3A04Z&sks=b&skv=2026-02-06&sig=FWBK9A0u0ekLWrKI%2BcedWByAiaz9J/ZmBQy32lqLAlg%3D',
              '15_session_creative.png': 'https://oaisdmntprukwest.blob.core.windows.net/files/00000000-9814-8243-85f3-016ff8385e3f/raw?se=2026-09-18T07%3A07%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=01a0b324-4716-7b03-899d-01a02003a946&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T04%3A58%3A24Z&ske=2026-09-19T04%3A58%3A24Z&sks=b&skv=2026-02-06&sig=2domo98pDSeXXtvChCg83lBflZcJg8Bn3EfgXMUeQsA%3D',
              '16_settings.png': 'https://oaisdmntprnortheu.blob.core.windows.net/files/00000000-16e0-81f4-a080-6fee545c7e9d/raw?se=2026-09-18T07%3A07%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=01a0b324-4716-7b03-899d-01a02003a946&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T04%3A58%3A23Z&ske=2026-09-19T04%3A58%3A23Z&sks=b&skv=2026-02-06&sig=uaWh3YDl3gzKKmc5hgfFc%2BdG45/w%2Bxdy%2B1UndCrMYsw%3D'
          }
          assert set(sources) == set(expected)
          def download(name):
              item = expected[name]
              assert '/' not in name and '\\' not in name and name.endswith('.png')
              with urllib.request.urlopen(sources[name], timeout=30) as response:
                  data = response.read(item['bytes'] + 1)
              assert valid(data, item), f'Original checksum or dimensions mismatch: {name}'
              target = root / name
              assert not target.exists() or target.read_bytes() == data, f'Refusing to overwrite: {name}'
              return name, data
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as executor:
              pending = dict(executor.map(download, expected))
          for name, data in pending.items():
              (root / name).write_bytes(data)
          readme = root / 'README.md'
          text = readme.read_text()
          start = text.index('**Статус переноса:**')
          end = text.index('\n\n', start)
          text = text[:start] + '**Статус переноса:** завершён. Все 17 PNG сверены с manifest исходного архива по SHA-256, размеру и PNG-заголовку. Оригинальные байты сохранены без обрезки или перекодирования.' + text[end:]
          finish = text.find('\n## Завершение переноса')
          if finish >= 0:
              text = text[:finish]
          text += '\n\n## Галерея\n\n![Обзор всех экранов](00_contact_sheet.png)\n\n'
          titles = ['Arrange', 'Mixer', 'Piano Roll', 'Vocal Recording / Comping', 'Audio Editor', 'Pitch Editor', 'Drum Editor / Step Sequencer', 'Sampler', 'Automation Editor', 'Plugin Rack / Channel Strip', 'Routing / Signal Flow', 'Browser', 'Mastering', 'Export Center', 'Session / Creative Mode', 'Settings / Preferences']
          for title, name in zip(titles, sorted(name for name in expected if not name.startswith('00_'))):
              text += f'### {title}\n\n![{title}]({name})\n\n'
          text += 'Ход внедрения реальных экранов: [IMPLEMENTATION.md](IMPLEMENTATION.md).\n'
          readme.write_text(text)
          implementation = root / 'IMPLEMENTATION.md'
          text = implementation.read_text().replace('Исходные PNG из [каталога референсов](README.md) пока ожидают отдельного переноса.', 'Исходные PNG доступны в [каталоге референсов](README.md); все 17 файлов проверены по исходному manifest.')
          implementation.write_text(text)
          print('PASS: 17 original PNGs verified and imported byte-for-byte.')
          PY
      - name: Commit only verified reference documentation to this branch
        run: |
          git add -- docs/design/references/general-digits
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --name-only
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs(design): import all 17 verified original UI reference PNGs'
          git push origin HEAD:refs/heads/codex/ui-design-references
