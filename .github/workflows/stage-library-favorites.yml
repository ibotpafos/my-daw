name: Apply reviewed library browser change
on:
  push:
    branches: ["codex/reference-workspace"]
    paths: [".github/workflows/stage-library-favorites.yml"]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'ibotpafos/my-daw'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply reviewed source patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD^)" = 12d36bded886b853487cd02f564a043982e22bf6
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.request
          import zlib
          chunks = [
              'e8e71ca1b75024e3c9cad9fb4ce6cff71d2bf6aa',
              '9d0024ffc02a1adb15c7fa2621f851fc31168b8c',
              '5eca777be71a5002b0dbbb51c0f935644d26985d',
              '455748c5fc9e967f5b2d99704fe25cdf6979d5f9',
          ]
          compressed = bytearray()
          for sha in chunks:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/ibotpafos/my-daw/git/blobs/{sha}',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  blob = json.load(response)
              if blob['sha'] != sha or blob['encoding'] != 'base64':
                  raise SystemExit('Unexpected Git blob')
              compressed.extend(base64.b64decode(blob['content']))
          patch = zlib.decompress(compressed)
          expected = '1cd4526c4507ec6b279032add13bffa5c93a05a1b957ad4343403c95d7163ebe'
          if hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Reviewed patch checksum mismatch')
          Path('/tmp/library-reviewed.patch').write_bytes(patch)
          PY
          git apply --check /tmp/library-reviewed.patch
          git apply --index /tmp/library-reviewed.patch
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(macos): add stable library favorites, filters and scoped keyboard audition'
          git push origin HEAD:refs/heads/codex/reference-workspace
