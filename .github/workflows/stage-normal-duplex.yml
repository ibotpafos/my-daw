name: One-shot P0-03 source transfer
on:
  push:
    branches: [codex/stage-normal-duplex]
permissions:
  contents: write
concurrency:
  group: p0-03-source-transfer
  cancel-in-progress: false
jobs:
  transfer:
    if: github.repository == 'ibotpafos/my-daw'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact reviewed source on merged P0-02 base
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/normal-transfer"
          python3 - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          encoded = ''.join(Path(f'.ci-transfer/normal-{i}').read_text() for i in range(4))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'a73ff9e179f36d0410e2de0337d7e60799b4aaa39ec8568df390be9b267de577'
          Path(os.environ['RUNNER_TEMP'], 'normal-transfer/change.patch').write_bytes(patch)
          PY
          git checkout --detach dd736b8b22bd44d8b127296e0e26cdf48f1f60a7
          git apply --index "$RUNNER_TEMP/normal-transfer/change.patch"
          test "$(git write-tree)" = 40aec8dc73cdf2654fb767c47a7a4a42ffe4daee
          test "$(git diff --cached --name-only | wc -l)" -eq 20
          test -z "$(git diff --cached --name-only -- .github .ci-transfer)"
      - name: Format with pinned major and build real recording test
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-18 libsamplerate0-dev pkg-config
          clang-format-18 -i engine/bridge/daw.cpp engine/audio/duplex_render.cpp engine/audio/duplex_render.hpp tests/normal_recording_tests.cpp
          git add engine/bridge/daw.cpp engine/audio/duplex_render.cpp engine/audio/duplex_render.hpp tests/normal_recording_tests.cpp
          git diff --cached --check
          git diff --cached --stat > "$RUNNER_TEMP/normal-transfer/diff-stat.txt"
          git write-tree > "$RUNNER_TEMP/normal-transfer/tree.txt"
          git archive --format=zip "$(git write-tree)" -o "$RUNNER_TEMP/normal-transfer/source.zip"
          cmake -S . -B build/transfer -DCMAKE_BUILD_TYPE=Debug -DDAW_SANITIZERS=ON
          cmake --build build/transfer --parallel 2 --target daw_normal_recording_tests 2>&1 | tee "$RUNNER_TEMP/normal-transfer/build.log"
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 ctest --test-dir build/transfer --output-on-failure -R '^normal_duplex_recording$' 2>&1 | tee "$RUNNER_TEMP/normal-transfer/tests.log"
          python3 scripts/e2e_coverage.py --strict
      - name: Publish only source and tests in a feature commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = dd736b8b22bd44d8b127296e0e26cdf48f1f60a7
          test -z "$(git diff --cached --name-only -- .github .ci-transfer)"
          test "$(git diff --cached --name-only | wc -l)" -eq 20
          git config user.name ibotpafos
          git config user.email 73589290+ibotpafos@users.noreply.github.com
          git commit -m 'feat(audio): ordinary full-duplex recording, backing, live MON and preroll (P0-03)'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/codex/core-normal-duplex-recording
          git rev-parse HEAD > "$RUNNER_TEMP/normal-transfer/commit.txt"
          git show --format=fuller --stat HEAD > "$RUNNER_TEMP/normal-transfer/commit-info.txt"
      - name: Preserve exact source and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p0-03-source-transfer-${{ github.run_id }}
          path: ${{ runner.temp }}/normal-transfer/
          retention-days: 7
          if-no-files-found: error
