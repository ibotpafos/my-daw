name: Fix workspace UI harness
on:
  push:
    branches: ["codex/reference-workspace"]
    paths: [".github/workflows/fix-workspace-ui-harness.yml"]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Split MIDI fixture construction into explicit Swift steps
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          path = Path('tests/workspace_ui_tests.swift')
          text = path.read_text()
          old = base64.b64decode('').decode()
          new = base64.b64decode('').decode()
          if text.count(old) != 1:
              raise SystemExit(f'Expected one reviewed MIDI fixture block, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git add tests/workspace_ui_tests.swift
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(macos): simplify workspace MIDI fixture construction'
          git push origin HEAD:refs/heads/codex/reference-workspace
