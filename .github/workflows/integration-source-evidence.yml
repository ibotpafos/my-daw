name: Integration source evidence
on:
  push:
    branches: [codex/midi-only-export-ui]
    paths: [.github/workflows/integration-source-evidence.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export Git objects without checkout credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/integration-evidence
          git bundle create /tmp/integration-evidence/source.bundle --all
          git bundle verify /tmp/integration-evidence/source.bundle
          git show-ref > /tmp/integration-evidence/refs.txt
          sha256sum /tmp/integration-evidence/source.bundle > /tmp/integration-evidence/source.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: integration-source-${{ github.sha }}
          path: /tmp/integration-evidence/
          if-no-files-found: error
          retention-days: 3
