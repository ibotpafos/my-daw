name: Prepare PR 8 current-main integration blobs
on:
  push:
    branches: [feature/command-palette-foundation]
    paths: [.github/workflows/prepare-palette-integration.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'ibotpafos/my-daw' && github.ref == 'refs/heads/feature/command-palette-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: acbd0439799f0cf3c9137e84deab5cc053fa4144
      - name: Reproduce reviewed merge preserving both editor milestones
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess, tempfile
          feature = 'e0f6d1a219451c3722af398293e1d3775dae6f95'
          base = '176aeb314983295fcf234915ac97de362d567607'
          main = 'acbd0439799f0cf3c9137e84deab5cc053fa4144'
          expected = {
              'CMakeLists.txt': 'b8ca03c2dd67969626f9b3d596b278a9f7ad0bd37d63965a9b0617f2705d3d6a',
              'apps/macos/main.swift': '8db4c98ed406d6bab9cb30585a29e1630cc4d7cf78fc55fd88f08e686cba5140',
              'scripts/typecheck-macos-ui.sh': '9a1e44ff197c7152734135cdc83b52fde367804d8542c0d4a868b471137bc866',
              'scripts/build-macos.sh': '98d70f9459b2d06a490f91f130985a7fbe6c648046915e8e7c465d498151febb',
          }
          def source(ref, path):
              return subprocess.check_output(['git', 'show', ref + ':' + path])
          for path, checksum in expected.items():
              if path == 'scripts/build-macos.sh':
                  text = source(main, path).decode('utf-8')
                  before = 'apps/macos/main.swift apps/macos/DAWWindow.swift'
                  after = 'apps/macos/main.swift apps/macos/CommandPaletteSearch.swift apps/macos/CommandPalette.swift apps/macos/DAWWindow.swift'
                  if text.count(before) != 1:
                      raise SystemExit('Unexpected source list')
                  merged = text.replace(before, after).encode('utf-8')
              else:
                  with tempfile.TemporaryDirectory() as directory:
                      files = [Path(directory) / name for name in ['ours', 'base', 'theirs']]
                      for file, ref in zip(files, [feature, base, main]):
                          file.write_bytes(source(ref, path))
                      merged = subprocess.check_output(['git', 'merge-file', '-p', *map(str, files)])
              if hashlib.sha256(merged).hexdigest() != checksum:
                  raise SystemExit('Merge differs from reviewed source: ' + path)
              Path(path).write_bytes(merged)
          for path in ['README.md', 'VERSION', 'apps/macos/Info.plist', 'docs/11-roadmap.md', 'docs/79-command-palette.md']:
              Path(path).write_bytes(source(feature, path))
          PY
          python3 -m pip install Markdown==3.8.2
          python3 scripts/build_handbook.py
          python3 scripts/check_docs.py
      - name: Publish only non-workflow source blobs, never branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          for path in ['CMakeLists.txt', 'apps/macos/main.swift', 'scripts/build-macos.sh', 'scripts/typecheck-macos-ui.sh', 'docs/index.html']:
              data = Path(path).read_bytes()
              payload = json.dumps({'encoding': 'utf-8', 'content': data.decode('utf-8')})
              reply = subprocess.check_output(['gh', 'api', '--method', 'POST', 'repos/ibotpafos/my-daw/git/blobs', '--input', '-'], input=payload, text=True)
              print(path, json.loads(reply)['sha'], hashlib.sha256(data).hexdigest())
          PY
