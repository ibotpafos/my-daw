name: Format maintenance
# Temporary and branch-scoped; only the reviewed bridge fixes below are committed.
on:
  push:
    branches: ["codex/midi-hardware-acceptance"]
    paths: [".github/workflows/format-maintenance.yml"]
permissions:
  contents: read
jobs:
  format:
    if: github.repository == 'ibotpafos/my-daw' && github.ref == 'refs/heads/codex/midi-hardware-acceptance'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Apply exact compiler fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('engine/bridge/daw.cpp')
          text = path.read_text()
          changes = {
              'entry.plugin.instrument ? DAW_VST3_FLAG_INSTRUMENT : 0u':
                  'entry.plugin.instrument ? static_cast<uint32_t>(DAW_VST3_FLAG_INSTRUMENT) : 0u',
              'int daw_get_midi_input_device(daw_session *s, uint32_t index, daw_midi_device *out) {':
                  'int daw_get_midi_input_device(daw_session *s, [[maybe_unused]] uint32_t index, daw_midi_device *out) {',
          }
          for before, after in changes.items():
              if text.count(before) != 1:
                  raise SystemExit('Reviewed code changed; refusing replacement')
              text = text.replace(before, after, 1)
          path.write_text(text)
          PY
          clang-format-18 -i engine/bridge/daw.cpp
          git diff --check
      - name: Commit only the bridge fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- engine/bridge/daw.cpp
          git commit -m 'fix(bridge): keep portable flags and MIDI stub warning-clean'
          git push origin HEAD:refs/heads/codex/midi-hardware-acceptance
      - name: Verify GCC build and tests
        run: |
          cmake --preset sanitizers
          cmake --build --preset sanitizers --parallel 2 -- -k
          ctest --preset sanitizers
