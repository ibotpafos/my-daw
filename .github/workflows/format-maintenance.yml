name: Format maintenance
# Temporary, same-repository migration. Remove after the reviewed changes land.
on:
  push:
    branches: ["codex/midi-hardware-acceptance"]
    paths: [".github/workflows/format-maintenance.yml"]
permissions:
  contents: read
jobs:
  format:
    if: github.repository == 'ibotpafos/my-daw' && github.ref == 'refs/heads/codex/midi-hardware-acceptance'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Apply guarded extraction and portability fixes
        run: |
          python3 scripts/maintenance_project_layout.py
          git diff --check
          bash -n scripts/build-macos.sh
      - name: Commit reviewed paths to the same branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- CMakeLists.txt cmake/DawPlatform.cmake cmake/DawTests.cmake \
            apps/macos/main.swift apps/macos/ProjectTime.swift apps/macos/TimelineRulerView.swift \
            apps/macos/sources.txt scripts/build-macos.sh engine/storage/storage.cpp \
            engine/bridge/daw.cpp engine/plugins/vst3_catalog.hpp \
            engine/platform/macos/vst3_scanner.hpp engine/platform/macos/vst3_scan_cache.hpp \
            scripts/test-au-music-device.sh scripts/test-midi-hardware.sh scripts/test-audio-preview.sh
          git commit -m 'refactor: separate app components, build modules and portable catalog metadata'
          git push origin HEAD:refs/heads/codex/midi-hardware-acceptance
      - name: Verify GCC build
        run: |
          cmake --preset sanitizers
          cmake --build --preset sanitizers --parallel 2
          ctest --preset sanitizers
