name: Diagnose export crash with LLDB
on:
  push:
    branches: [codex/diagnose-export-crash-20260918]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: clock-feature
            source: 46d1cab9023528eb417f9aff1af044cc37bbf09b
          - label: unchanged-main
            source: f943a7bc455031091ba249f01150078964de8321
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - name: Build exact application and a symbolized unchanged export harness
        run: |
          set -euo pipefail
          mkdir -p build/export-diagnostics
          { git rev-parse HEAD; sw_vers; xcrun swiftc --version; } > build/export-diagnostics/source.txt
          ./scripts/build-macos.sh > build/export-diagnostics/build.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          script = Path('scripts/test-mix-export-ui.sh').read_text()
          assert script.count("python3 - <<'PY'") == 1
          compile_only = script.split("python3 - <<'PY'")[0].replace('xcrun swiftc ', 'xcrun swiftc -g ', 1)
          Path('scripts/diagnose-compile-export.sh').write_text(compile_only)
          PY
          bash scripts/diagnose-compile-export.sh > build/export-diagnostics/compile.log 2>&1
      - name: Capture actual crash stacks, not a retry-to-green
        run: |
          set -euo pipefail
          cat > build/export-diagnostics/diagnose.py <<'PY'
          import json, os, pathlib, lldb
          def diagnose(debugger, command, result, internal_dict):
              output = pathlib.Path('build/export-diagnostics')
              debugger.SetAsync(False)
              debugger.HandleCommand('settings set target.disable-aslr false')
              target = debugger.CreateTarget('build/mix-export-ui/export-tests')
              if not target.IsValid():
                  raise RuntimeError('LLDB could not create the real test target')
              process = target.LaunchSimple(None, None, os.getcwd())
              state = process.GetState()
              print('DIAGNOSTIC PROCESS STATE', state, 'EXIT', process.GetExitStatus(), flush=True)
              print('STDOUT', process.GetSTDOUT(1048576), flush=True)
              print('STDERR', process.GetSTDERR(1048576), flush=True)
              stopped = state != lldb.eStateExited
              if stopped:
                  for thread in process:
                      print('THREAD', thread.GetThreadID(), thread.GetStopDescription(512), flush=True)
                      for index in range(min(thread.GetNumFrames(), 180)):
                          frame = thread.GetFrameAtIndex(index)
                          print(frame, flush=True)
                  debugger.HandleCommand('register read')
                  debugger.HandleCommand('image list')
              report = {'state': state, 'exited': state == lldb.eStateExited,
                        'exit_status': process.GetExitStatus(), 'thread_count': process.GetNumThreads()}
              (output / 'process.json').write_text(json.dumps(report, indent=2))
              if stopped and process.IsValid():
                  process.Kill()
          def __lldb_init_module(debugger, internal_dict):
              debugger.HandleCommand('command script add -f diagnose.diagnose export-diagnose')
          PY
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          root = Path('build/export-diagnostics')
          with (root / 'lldb.log').open('w') as log:
              try:
                  run = subprocess.run(['xcrun','lldb','--batch','-o','command script import build/export-diagnostics/diagnose.py','-o','export-diagnose'], stdout=log, stderr=subprocess.STDOUT, timeout=180, check=False)
              except subprocess.TimeoutExpired:
                  (root / 'timeout.txt').write_text('LLDB/test did not complete within 180 seconds')
                  raise
          print((root / 'lldb.log').read_text())
          report = json.loads((root / 'process.json').read_text())
          if run.returncode != 0 or not report['exited'] or report['exit_status'] != 0:
              raise SystemExit('Diagnostic execution reproduced a failure; see lldb.log')
          PY
      - name: Preserve exact diagnostic evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: export-crash-${{ matrix.label }}-${{ github.run_id }}
          path: |
            build/export-diagnostics/
            build/mix-export-ui/proof.json
          if-no-files-found: error
          retention-days: 7
