name: Prepare reviewed ordinary duplex recording
on:
  push:
    branches: [codex/stage-p0-03-duplex-20260918]
permissions:
  contents: write
concurrency:
  group: prepare-p0-03-duplex
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reproduce exact locally checked source on a separate branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=dd736b8b22bd44d8b127296e0e26cdf48f1f60a7
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git diff --name-only "$base" HEAD)" = .github/workflows/stage-p0-03-duplex.yml
          chunks=(76cecf6cf2b34fdb282c148e5e89c635c1f12585 594666ea2a610799b499a95d4b4b59e2cae0c6af b31c70cccc40f71bf86b617d219a303ad98d399e baf25781ff0e899a90a2556fcbfaceb39fc4ebee)
          for index in "${!chunks[@]}"; do
            curl --fail --silent --show-error --retry 2 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/ibotpafos/my-daw/git/blobs/${chunks[$index]}" -o "$RUNNER_TEMP/duplex-part-$index.json"
          done
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          data = b''.join(base64.b64decode(json.loads((root / f'duplex-part-{i}.json').read_text())['content']) for i in range(4))
          assert hashlib.sha256(data).hexdigest() == '180391c1eea5beb989747859ebecbb9f03ed9a3688311b964bd2dbc7cc9c3598'
          (root / 'duplex.patch').write_bytes(lzma.decompress(data))
          PY
          git read-tree --reset -u "$base"
          git apply --index --unidiff-zero "$RUNNER_TEMP/duplex.patch"
          test "$(git write-tree)" = ab2f05918724f3835164143596062901b40730bc
          test ! -f .github/workflows/stage-p0-03-duplex.yml
          git diff --cached --check
          cp engine/bridge/daw.cpp "$RUNNER_TEMP/duplex-bridge-before.cpp"
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-18
          clang-format-18 -i engine/bridge/daw.cpp
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          before = (Path(os.environ['RUNNER_TEMP']) / 'duplex-bridge-before.cpp').read_bytes()
          after = Path('engine/bridge/daw.cpp').read_bytes()
          assert re.sub(rb'\s+', b'', before) == re.sub(rb'\s+', b'', after), 'formatter changed non-whitespace bytes'
          PY
          git add engine/bridge/daw.cpp
          git diff --cached --check
          python3 -m unittest discover -s tests -p test_project_layout.py -v
          python3 scripts/e2e_coverage.py --strict
          git config user.name 'ibotpafos'
          git config user.email '73589290+ibotpafos@users.noreply.github.com'
          tree=$(git write-tree)
          head=$(git commit-tree "$tree" -p "$base" -m 'feat(audio): ordinary full-duplex recording with dry capture, live MON and pre-roll')
          branch=codex/core-ordinary-duplex-recording
          test -z "$(git ls-remote origin "refs/heads/$branch")"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "$head:refs/heads/$branch"
          mkdir -p build/duplex-source
          git archive --format=zip "$head" -o build/duplex-source/source.zip
          printf '%s\n' "$head" "$tree" > build/duplex-source/revision.txt
          shasum -a 256 build/duplex-source/source.zip > build/duplex-source/SHA256SUMS
          echo "Published feature HEAD=$head TREE=$tree; main unchanged; full native/core CI required before merge"
      - name: Preserve exact published source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ordinary-duplex-reviewed-source
          path: build/duplex-source/
          if-no-files-found: error
          retention-days: 7
