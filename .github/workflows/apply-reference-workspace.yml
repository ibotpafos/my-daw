name: Apply reference workspace patch
on:
  push:
    branches: ["codex/reference-workspace"]
    paths: [".github/workflows/apply-reference-workspace.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Reconstruct reviewed patch
        run: |
          cat .github/maintenance/workspace.patch.part00 \
              .github/maintenance/workspace.patch.part01 \
              .github/maintenance/workspace.patch.part02 \
              .github/maintenance/workspace.patch.part03 \
            | base64 --decode | xz -dc > /tmp/reference-workspace.patch
          printf '%s  %s\n' '127e4cee30c0f050b8013ac91fc8c993fb4d6558cc058015c888b734d16483a8' '/tmp/reference-workspace.patch' | sha256sum -c -
      - name: Materialize exact reviewed postimages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          lines = Path('/tmp/reference-workspace.patch').read_text().splitlines(keepends=True)
          i = 0; touched = []
          while i < len(lines):
              if not lines[i].startswith('diff --git '): i += 1; continue
              m = re.match(r'diff --git a/(.+) b/(.+)\n?$', lines[i]); old_path, new_path = m.group(1), m.group(2); i += 1
              old_sha = new_sha = None
              while i < len(lines) and not lines[i].startswith('--- '):
                  im = re.match(r'index ([0-9a-f]{40})\.\.([0-9a-f]{40})', lines[i])
                  if im: old_sha, new_sha = im.groups()
                  i += 1
              old_marker = lines[i].strip(); i += 1; i += 1
              path = Path(new_path)
              if old_marker == '--- /dev/null': current = []
              else:
                  actual = subprocess.check_output(['git','hash-object',new_path], text=True).strip()
                  if old_sha and actual != old_sha: raise SystemExit(f'preimage mismatch {new_path}: {actual} != {old_sha}')
                  current = path.read_text().splitlines(keepends=True)
              offset = 0
              while i < len(lines) and not lines[i].startswith('diff --git '):
                  if not lines[i].startswith('@@ '): i += 1; continue
                  hm = re.match(r'@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@', lines[i]); old_start = int(hm.group(1)); i += 1
                  src, dst = [], []
                  while i < len(lines) and not lines[i].startswith('@@ ') and not lines[i].startswith('diff --git '):
                      line = lines[i]
                      if line.startswith(' '): src.append(line[1:]); dst.append(line[1:])
                      elif line.startswith('-'): src.append(line[1:])
                      elif line.startswith('+'): dst.append(line[1:])
                      i += 1
                  expected = max(0, old_start - 1 + offset)
                  if src:
                      candidates = [p for p in range(len(current)-len(src)+1) if current[p:p+len(src)] == src]
                      if expected in candidates: pos = expected
                      elif len(candidates) == 1: pos = candidates[0]
                      else: raise SystemExit(f'ambiguous/missing hunk in {new_path} near {old_start}: {candidates[:8]}')
                  else: pos = min(len(current), old_start + offset)
                  current[pos:pos+len(src)] = dst; offset += len(dst)-len(src)
              path.parent.mkdir(parents=True, exist_ok=True); path.write_text(''.join(current))
              actual_new = subprocess.check_output(['git','hash-object',new_path], text=True).strip()
              if new_sha and actual_new != new_sha: raise SystemExit(f'postimage mismatch {new_path}: {actual_new} != {new_sha}')
              touched.append(new_path)
          print(f'Exact postimages materialized: {len(touched)} files')
          PY
          git diff --check
      - name: Commit application sources only
        run: |
          rm -f .github/workflows/workspace-ui.yml
          git add apps docs scripts tests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(macos): build reference workspace layout'
          git push origin HEAD:refs/heads/codex/reference-workspace
