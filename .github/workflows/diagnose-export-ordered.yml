name: Verify exact native crash collection after parser fix
on:
  push:
    branches: [codex/diagnose-export-ordered-20260918]
permissions:
  contents: read
jobs:
  collector:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5e6413a619a7168b6d0d65edfefc7b201a1ad610
          persist-credentials: false
      - name: Verify real process crash, OS report and unchanged failure exit
        run: |
          set -euo pipefail
          mkdir -p build/crash-collector-proof
          cat > build/crash-collector-proof/fault.c <<'C'
          #include <sys/mman.h>
          int main(void) {
            void *p = mmap(0, 4096, PROT_NONE, MAP_ANON | MAP_PRIVATE, -1, 0);
            if (p == MAP_FAILED) return 77;
            return *(volatile int *)p;
          }
          C
          xcrun clang -g build/crash-collector-proof/fault.c -o build/crash-collector-proof/daw-fault-probe
          python3 -m unittest discover -s tests -p test_native_test_runner.py -v
          python3 - <<'PY'
          import importlib.util,json
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('runner','scripts/native_test_runner.py')
          runner=importlib.util.module_from_spec(spec);spec.loader.exec_module(runner)
          root=Path('build/crash-collector-proof')
          code=runner.run_test([str(root/'daw-fault-probe')],root/'evidence',15,report_wait=20)
          result=json.loads((root/'evidence/run.json').read_text())
          assert code in (138,139) and result['returncode'] in (-10,-11),result
          assert result['attempts']==1 and not result['timed_out'],result
          assert result['crash_report_found'] and len(result['crash_reports'])==1,result
          report=root/'evidence'/result['crash_reports'][0]
          h,p=report.read_bytes().split(b'\n',1);h=json.loads(h);p=json.loads(p)
          assert h['bug_type']=='309' and p['pid']==result['pid'] and p['procName']=='daw-fault-probe',p
          assert p['exception']['type']=='EXC_BAD_ACCESS',p
          (root/'proof.json').write_text(json.dumps({'collector_verified':True,'pid':result['pid'],
              'signal':result['signal'],'exit_code':code,'attempts':1,'bug_type':h['bug_type'],
              'exception':p['exception']['type'],'procLaunch':p['procLaunch']},indent=2))
          print('PASS: actual OS IPS from a known protected-memory fault, matched exact PID; original failure retained')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: verified-crash-collector-${{ github.run_id }}
          path: build/crash-collector-proof/
          if-no-files-found: error
          retention-days: 7
