name: Diagnose exact native crash report availability
on:
  push:
    branches: [codex/diagnose-export-ordered-20260918]
permissions:
  contents: read
jobs:
  collector:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6cc52725c154c90bdd87cc81b371c79975d41e2f
          persist-credentials: false
      - name: Exercise one deliberate memory fault and inspect only this test process reports
        run: |
          set -euo pipefail
          mkdir -p build/crash-collector-probe
          cat > build/crash-collector-probe/fault.c <<'C'
          #include <sys/mman.h>
          int main(void) {
            void *p = mmap(0, 4096, PROT_NONE, MAP_ANON | MAP_PRIVATE, -1, 0);
            if (p == MAP_FAILED) return 77;
            return *(volatile int *)p;
          }
          C
          xcrun clang -g build/crash-collector-probe/fault.c -o build/crash-collector-probe/daw-fault-probe
          python3 - <<'PY'
          import importlib.util,json,os,sys,time,traceback,subprocess
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('runner','scripts/native_test_runner.py')
          runner=importlib.util.module_from_spec(spec);spec.loader.exec_module(runner)
          root=Path('build/crash-collector-probe'); started=time.time()
          code=runner.run_test([str(root/'daw-fault-probe')],root/'evidence',15,report_wait=20)
          result=json.loads((root/'evidence/run.json').read_text())
          print('RESULT',result,'Python',sys.version,'HOME',Path.home())
          directories=[Path.home()/'Library/Logs/DiagnosticReports',Path('/Library/Logs/DiagnosticReports')]
          diagnostics=[]
          for directory in directories:
            print('REPORT DIRECTORY',str(directory),directory.exists())
            for path in directory.glob('daw-fault-probe*'):
              if path.is_symlink() or not path.is_file() or path.stat().st_size>8*1024*1024: continue
              data=path.read_bytes(); item={'name':path.name,'mtime':path.stat().st_mtime,'bytes':len(data)}
              try:
                header,payload=data.split(b'\n',1); h=json.loads(header);r=json.loads(payload)
                item.update(header=h,pid=r.get('pid'),procName=r.get('procName'),procLaunch=r.get('procLaunch'))
                if r.get('pid')==result['pid']:
                  (root/('raw-'+path.name)).write_bytes(data)
                  item['matched']=runner.matched_report(path,result['pid'],root/'daw-fault-probe',started) is not None
              except Exception as error: item['parse_error']=str(error)
              diagnostics.append(item); print('CANDIDATE',item)
          (root/'candidates.json').write_text(json.dumps(diagnostics,indent=2))
          for args in [['defaults','read','com.apple.CrashReporter'],['launchctl','print',f'gui/{os.getuid()}/com.apple.ReportCrash'],['launchctl','print','system/com.apple.ReportCrash.Root']]:
            p=subprocess.run(args,capture_output=True,text=True,timeout=5)
            print('REPORTER SETUP',args,p.returncode,p.stdout[:16000],p.stderr[:1000])
          assert code in (138,139),result
          assert result['crash_report_found'], 'No matching actual OS crash report; see candidate diagnostics'
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: exact-crash-collector-${{ github.run_id }}
          path: build/crash-collector-probe/
          if-no-files-found: error
          retention-days: 7
