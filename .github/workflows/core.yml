name: Core and macOS prototype
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure
        run: cmake --preset sanitizers
      - name: Build
        run: cmake --build --preset sanitizers
      - name: Test
        run: ctest --preset sanitizers
      - name: Docs and contract checks
        run: python3 scripts/check_docs.py
      - name: E2E coverage ledger
        run: python3 scripts/e2e_coverage.py --strict
      - name: Build AppKit prototype
        if: runner.os == 'macOS'
        run: ./scripts/build-macos.sh
  command-palette:
    # Independent of the audio/core matrix: an unrelated C++ build failure must
    # not skip native Swift compiler and keyboard/dispatch regression coverage.
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Command palette models and AppKit integration
        run: bash scripts/test-command-palette.sh
