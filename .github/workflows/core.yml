name: Core and macOS prototype
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake --preset sanitizers
      - name: Build
        run: cmake --build --preset sanitizers
      - name: Test
        run: ctest --preset sanitizers
      - name: Docs and contract checks
        run: python3 scripts/check_docs.py
      - name: E2E coverage ledger
        run: python3 scripts/e2e_coverage.py --strict
      - name: Build AppKit prototype
        if: runner.os == 'macOS'
        run: ./scripts/build-macos.sh
