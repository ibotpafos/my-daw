name: Core and macOS prototype
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: core-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure
        run: cmake --preset sanitizers
      - name: Build
        run: cmake --build --preset sanitizers
      - name: Test
        run: ctest --preset sanitizers
      - name: Docs and contract checks
        run: python3 scripts/check_docs.py
      - name: E2E coverage ledger
        run: python3 scripts/e2e_coverage.py --strict
      - name: Build AppKit prototype
        if: runner.os == 'macOS'
        run: ./scripts/build-macos.sh
