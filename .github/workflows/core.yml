name: Core and macOS prototype
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake --preset sanitizers
      - name: Build
        run: cmake --build --preset sanitizers --parallel 2
      - name: Test
        run: ctest --preset sanitizers
      - name: Docs and contract checks
        if: ${{ !cancelled() }}
        run: python3 scripts/check_docs.py
      - name: E2E coverage ledger
        if: ${{ !cancelled() }}
        run: python3 scripts/e2e_coverage.py --strict
      - name: Build AppKit prototype
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: ./scripts/build-macos.sh
