name: Publish exact export diagnostic source
on:
  push:
    branches: [codex/stage-export-evidence-20260918]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reproduce and publish the locally tested source without changing main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=51640fac9ce4feb362d4be81d529b2dff9c3699a
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git diff --name-only "$base" HEAD)" = .github/workflows/stage-export-evidence.yml
          curl --fail --silent --show-error --retry 2 -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/ibotpafos/my-daw/git/blobs/0028ea25dfa493fdd622929baed3911da7bee0f6 -o "$RUNNER_TEMP/export-patch.json"
          python3 - <<'PY'
          import base64, hashlib, json, os, zlib
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          blob = json.loads((root / 'export-patch.json').read_text())
          assert blob['encoding'] == 'base64'
          data = base64.b64decode(blob['content'])
          assert hashlib.sha256(data).hexdigest() == 'd31fd785b8cffd30255e11e362cd2a4a8afd7758d9ea9ea8e820e264ffee9086'
          (root / 'export.patch').write_bytes(zlib.decompress(data))
          PY
          git read-tree --reset -u "$base"
          git apply --index "$RUNNER_TEMP/export.patch"
          test "$(git write-tree)" = 45027ca3fb68baed5ab87812d0294d26d3adaa89
          git diff --cached --check
          git diff --cached "$base" --exit-code -- .github
          python3 -m unittest discover -s tests -p test_native_test_runner.py -v
          python3 -m unittest discover -s tests -p test_project_layout.py -v
          git config user.name 'ibotpafos'
          git config user.email '73589290+ibotpafos@users.noreply.github.com'
          head=$(git commit-tree "$(git write-tree)" -p "$base" -m 'test(export): preserve native crash evidence and stress Save/Open range export')
          branch=codex/core-export-crash-evidence
          test -z "$(git ls-remote origin "refs/heads/$branch")"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "$head:refs/heads/$branch"
          echo "Published feature $head; native CI still required; main unchanged"
