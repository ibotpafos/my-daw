name: Merge main into arrangement final once
on:
  push:
    branches:
      - codex/stage-arrangement-final-main-20260918
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Merge current main into final arrangement branch
        shell: bash
        run: |
          set -euo pipefail
          feature=f081485cb71bdcedd784de91efb749fab52ba847
          git config user.name "ibotpafos"
          git config user.email "73589290+ibotpafos@users.noreply.github.com"
          git fetch origin main codex/arrangement-mixed-clipboard
          git checkout -B arrangement-final "$feature"
          mkdir -p .git/info
          cat > .git/info/attributes <<'ATTRS'
          apps/macos/main.swift merge=union
          cmake/DawTests.cmake merge=union
          engine/bridge/daw.cpp merge=union
          engine/bridge/daw.h merge=union
          tests/e2e/e2e_duplex_recording.cpp merge=union
          ATTRS
          git merge --no-ff origin/main -m "merge(main): resolve final arrangement editor against current main"
          if grep -nE '^(<<<<<<<|=======|>>>>>>>)' apps/macos/main.swift cmake/DawTests.cmake engine/bridge/daw.cpp engine/bridge/daw.h tests/e2e/e2e_duplex_recording.cpp; then
            echo "Conflict markers remain" >&2
            exit 1
          fi
          git diff --check HEAD^1..HEAD
          git push origin HEAD:refs/heads/codex/arrangement-mixed-clipboard
