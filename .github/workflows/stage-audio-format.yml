name: One-shot P0-02 source transfer
on:
  push:
    branches: [codex/stage-audio-format]
permissions:
  contents: write
concurrency:
  group: p0-02-source-transfer
  cancel-in-progress: false
jobs:
  transfer:
    if: github.repository == 'ibotpafos/my-daw'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Decode and verify exact reviewed patch
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/format-transfer"
          python3 - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          encoded = ''.join(Path(f'.ci-transfer/part-{i}').read_text() for i in range(4))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '7390d4fe8059524c07218728ee3adab883af454e4b13312daea1050c140fae72'
          Path(os.environ['RUNNER_TEMP'], 'format-transfer/change.patch').write_bytes(patch)
          PY
          git checkout --detach 852611cdd2c9c2a3dde4d0e20caa5efc50d96474
          git apply --index "$RUNNER_TEMP/format-transfer/change.patch"
          test "$(git diff --cached --name-only | wc -l)" -eq 20
          test -z "$(git diff --cached --name-only -- .github .ci-transfer)"
      - name: Format with repository-pinned major and compile target checks
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-18 libsamplerate0-dev pkg-config
          clang-format-18 -i engine/bridge/daw.cpp engine/audio/device_settings.cpp engine/audio/device_settings.hpp tests/audio_hardware_tests.cpp tests/e2e/e2e_audio_hardware_settings.cpp
          git add engine/bridge/daw.cpp engine/audio/device_settings.cpp engine/audio/device_settings.hpp tests/audio_hardware_tests.cpp tests/e2e/e2e_audio_hardware_settings.cpp
          git diff --cached --check
          git diff --cached --stat > "$RUNNER_TEMP/format-transfer/diff-stat.txt"
          git write-tree > "$RUNNER_TEMP/format-transfer/tree.txt"
          git archive --format=zip "$(git write-tree)" -o "$RUNNER_TEMP/format-transfer/source.zip"
          cp /usr/include/samplerate.h "$RUNNER_TEMP/format-transfer/samplerate.h"
          cmake -S . -B build/transfer -DCMAKE_BUILD_TYPE=Debug -DDAW_SANITIZERS=ON
          cmake --build build/transfer --parallel 2 --target daw_audio_hardware_tests e2e_audio_hardware_settings 2>&1 | tee "$RUNNER_TEMP/format-transfer/build.log"
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 ctest --test-dir build/transfer --output-on-failure -R '^(audio_hardware_acknowledgement|e2e_audio_hardware_settings)$' 2>&1 | tee "$RUNNER_TEMP/format-transfer/tests.log"
          python3 scripts/e2e_coverage.py --strict
      - name: Publish only the feature commit to a separate branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 852611cdd2c9c2a3dde4d0e20caa5efc50d96474
          test -z "$(git diff --cached --name-only -- .github .ci-transfer)"
          test "$(git diff --cached --name-only | wc -l)" -eq 20
          git config user.name ibotpafos
          git config user.email 73589290+ibotpafos@users.noreply.github.com
          git commit -m 'feat(core): acknowledged hardware rate and buffer settings (P0-02)'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/codex/core-audio-rate-buffer
          git rev-parse HEAD > "$RUNNER_TEMP/format-transfer/commit.txt"
          git show --format=fuller --stat HEAD > "$RUNNER_TEMP/format-transfer/commit-info.txt"
      - name: Preserve exact source and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p0-02-source-transfer-${{ github.run_id }}
          path: ${{ runner.temp }}/format-transfer/
          retention-days: 7
          if-no-files-found: error
