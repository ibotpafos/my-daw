name: Apply reviewed main palette integration
on:
  push:
    branches: ["codex/midi-only-export-ui"]
    paths: [".github/workflows/stage-final-palette-integration.yml"]
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Replay the reviewed resolution and preserve both histories
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous=f95a8c9b62a91c3ba01eff1892f8c7e2c65f0603
          base=fdcd21842c017257e1b41ce47eaa7445af590c0d
          test "$(git rev-parse HEAD^)" = "$previous"
          test "$(git diff --name-only "$previous" HEAD)" = '.github/workflows/stage-final-palette-integration.yml'
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$base"
          test "$(git ls-remote origin refs/heads/codex/midi-only-export-ui | cut -f1)" = "$GITHUB_SHA"
          test "$(git rev-parse "$previous^{tree}")" = '05850ed6939f44e6d061b6eb2f0b10aa6753bfac'
          test "$(git rev-parse "$base^{tree}")" = '2ec275feafd9584920a4fa64244436fa09c6a075'
          curl --fail --silent --show-error --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/ibotpafos/my-daw/git/blobs/d6e392def65998ce04347dc2e0ff88780348e479 \
            -o "$RUNNER_TEMP/resolution-blob.json"
          python3 - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          blob = json.loads((root / 'resolution-blob.json').read_text())
          assert blob['encoding'] == 'base64'
          patch = base64.b64decode(blob['content'])
          assert hashlib.sha256(patch).hexdigest() == 'aec6c38a87c4a5c7e2c53f1380d13c09611127dd60ada895b23fdc2125482e4b'
          (root / 'resolution.patch').write_bytes(patch)
          PY
          # Start from the verified integration tree, including all engine/MIDI/mixer work.
          # The one-shot publisher removes itself from the result.
          git read-tree --reset -u "$previous"
          git checkout "$base" -- \
            apps/macos/CommandPalette.swift apps/macos/CommandPaletteSearch.swift \
            scripts/test-command-palette.sh tests/macos_command_palette_appkit_tests.swift \
            tests/macos_command_palette_search_tests.swift docs/79-command-palette.md \
            VERSION apps/macos/Info.plist README.md docs/11-roadmap.md docs/index.html \
            apps/macos/DAWWindow.swift
          git apply --index --check "$RUNNER_TEMP/resolution.patch"
          git apply --index "$RUNNER_TEMP/resolution.patch"
          git diff --cached --check
          tree="$(git write-tree)"
          test "$tree" = 'c37f790472a310ad4ef05642bd7b05fe9d36e776'
          test ! -e .github/workflows/stage-final-palette-integration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit="$(git commit-tree "$tree" -p "$GITHUB_SHA" -p "$base" -m 'merge: preserve command palette and workspace keyboard safety on main 1.74.0')"
          git push origin "$commit:refs/heads/codex/midi-only-export-ui"
          printf 'Resolved commit: %s\nReviewed tree: %s\n' "$commit" "$tree" | tee -a "$GITHUB_STEP_SUMMARY"
