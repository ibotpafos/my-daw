name: Publish sanitizer-verified palette integration
on:
  push:
    branches: [codex/midi-only-export-ui]
    paths: [.github/workflows/finish-palette-integration.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reproduce the exact tree already passing 35 sanitizer tests
        env:
          SOURCE_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 77764bb844db062dc5115a0fc7b26de1565d2103
          test "$(git rev-parse 5465ce8d5a7b3ad4fb4d7cb193e43deb413a4bd0:.github/workflows/finish-palette-integration.yml)" = 841f42b801cd132d0f2959f8e09adba2759120bd
          python3 - <<'PY'
          from pathlib import Path
          import os, subprocess, textwrap
          source = subprocess.check_output(['git','show','5465ce8d5a7b3ad4fb4d7cb193e43deb413a4bd0:.github/workflows/finish-palette-integration.yml'], text=True)
          script = textwrap.dedent(source.split('        run: |\n', 1)[1])
          # Reuse the immutable reviewed resolution, not arbitrary branch code.
          # Its output passed 35/35 ASan/UBSan CTests in run 35259397446.
          script = script.split('sudo apt-get update -qq\n', 1)[0]
          script = script.replace('test "$(git rev-parse HEAD^)" = fc6c71ba2096b9c61fc071c31613528493a3816d', 'test "$(git rev-parse HEAD^)" = 77764bb844db062dc5115a0fc7b26de1565d2103', 1)
          original = '.github/workflows/finish-palette-integration.yml'
          obsolete = '.github/workflows/stage-final-palette-integration.yml'
          script = script.replace('git rm --cached '+original, 'git rm --cached '+original+' '+obsolete, 1)
          script = script.replace('git restore --source="$SOURCE_HEAD" --staged '+original, 'git restore --source="$SOURCE_HEAD" --staged '+original+' '+obsolete, 1)
          assert 'test "$reviewed_tree" = b0d361a7d238d21e4b0e1f73df85783bfc20b943' in script
          assert 'git push' not in script
          Path(os.environ['RUNNER_TEMP'], 'reviewed-resolution.sh').write_text(script)
          PY
          bash "$RUNNER_TEMP/reviewed-resolution.sh"
      - name: Publish feature branch only; normal full PR gates remain mandatory
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/midi-only-export-ui | cut -f1)" = "$SOURCE_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = fdcd21842c017257e1b41ce47eaa7445af590c0d
          git diff --cached "$SOURCE_HEAD" --exit-code -- .github
          git diff --cached --check
          git commit -m 'merge(integration): preserve palette, workspace, MIDI export and portable resampling' -m 'Reviewed normalized tree b0d361a7d238d21e4b0e1f73df85783bfc20b943 passed 35/35 sanitizer CTests in run 35259397446. Full native/SDK/PR checks required after publication; main is not changed by this publisher.'
          printf '%s\n' '#!/bin/sh' 'case "$1" in *Username*) echo x-access-token ;; *) printf "%s\n" "$GH_TOKEN" ;; esac' > "$RUNNER_TEMP/askpass.sh"
          chmod 700 "$RUNNER_TEMP/askpass.sh"
          trap 'rm -f "$RUNNER_TEMP/askpass.sh"' EXIT
          export GIT_ASKPASS="$RUNNER_TEMP/askpass.sh" GIT_TERMINAL_PROMPT=0
          git push origin HEAD:refs/heads/codex/midi-only-export-ui
          git log -1 --format='%H %T'
