name: Piano roll transform core
on:
  pull_request:
    paths:
      - 'apps/macos/PianoRoll/**'
      - 'tests/piano_roll/**'
      - 'scripts/test-piano-roll-transforms.sh'
      - '.github/workflows/piano-roll-transforms.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transforms:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Swift compiler
        run: swiftc --version
      - name: Test MIDI note transforms on macOS
        run: bash scripts/test-piano-roll-transforms.sh
