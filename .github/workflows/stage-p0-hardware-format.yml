name: Finalize reviewed hardware document guard
on:
  push:
    branches: [codex/stage-p0-hardware-format-20260918]
    paths: [.github/workflows/stage-p0-hardware-format.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply the four-file reviewed UI and document guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base=87bc75b23a7ab6e7203147affe7ef03c7f43e172
          test "$(git rev-parse HEAD^)" = e680e9dcf0b7f6b4e9f6455ecf4868f2c391ef22
          test "$(git rev-parse "$base^{tree}")" = 51967f26915114626597246e4fb8463efe19872f
          curl --fail --silent --show-error --retry 2 -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/ibotpafos/my-daw/git/blobs/65502f9493d076d3e74704b84ef02f98391641ee \
            -o "$RUNNER_TEMP/guard.json"
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          blob = json.loads((root / 'guard.json').read_text())
          assert blob['encoding'] == 'base64'
          data = base64.b64decode(blob['content'])
          assert hashlib.sha256(data).hexdigest() == '6aa16fed4a239e6f198631754a6d4cf36fdb1ad94a1f3c73695fbc134d01337a'
          (root / 'guard.patch').write_bytes(lzma.decompress(data))
          PY
          git read-tree --reset -u "$base"
          git apply --index --unidiff-zero "$RUNNER_TEMP/guard.patch"
          git diff --cached --check
          test "$(git write-tree)" = 58ada0d2b495f72c18d14f3f4feda9c28787d2d1
          git diff --cached "$base" --exit-code -- engine cmake CMakeLists.txt .github
          python3 -m unittest discover -s tests -p test_project_layout.py -v
          python3 scripts/e2e_coverage.py --strict
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 852611cdd2c9c2a3dde4d0e20caa5efc50d96474
          test "$(git ls-remote origin refs/heads/codex/core-audio-hardware-format | cut -f1)" = "$base"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -p "$base" -m 'fix(audio): preserve current document when machine settings cannot be restored')
          printf '%s\n' '#!/bin/sh' 'case "$1" in *Username*) echo x-access-token ;; *) printf "%s\n" "$GH_TOKEN" ;; esac' > "$RUNNER_TEMP/guard-askpass.sh"
          chmod 700 "$RUNNER_TEMP/guard-askpass.sh"
          trap 'rm -f "$RUNNER_TEMP/guard-askpass.sh"' EXIT
          GIT_ASKPASS="$RUNNER_TEMP/guard-askpass.sh" GIT_TERMINAL_PROMPT=0 git push origin "$commit:refs/heads/codex/core-audio-hardware-format"
          printf 'Final candidate: %s\nTree: %s\nNative PR tests and full regressions remain mandatory.\n' "$commit" "$tree" | tee -a "$GITHUB_STEP_SUMMARY"
