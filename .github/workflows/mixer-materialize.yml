name: Materialize and validate mixer implementation
on:
  push:
    branches: [codex/mixer-console]
    paths:
      - '.github/mixer-stage/**'
      - '.github/workflows/mixer-materialize.yml'
permissions:
  contents: write
concurrency:
  group: mixer-materialize
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'ibotpafos/my-daw' && github.ref == 'refs/heads/codex/mixer-console'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      # One-time transport of the locally built patch. No remote code is fetched.
      # Check the exact payload, index preimages and branch head; never force push.
      - name: Publish exact integrated source changes
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/mixer-console
          test "$(git ls-remote origin refs/heads/codex/mixer-console | cut -f1)" = "$GITHUB_SHA"
          git merge-base --is-ancestor d230d1105fe45b41614fe55e043dde8aa91c332f HEAD
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, subprocess
          parts = sorted(Path('.github/mixer-stage').glob('part-*.b64'))
          if len(parts) != 8: raise SystemExit('Expected exactly eight payload parts')
          data = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True))
          if hashlib.sha256(data).hexdigest() != '80a2fd676509357a2a88e4e59920866e23ac37710c254879f9c6720740ca8c73':
              raise SystemExit('Patch checksum mismatch')
          patch = Path('/tmp/mixer-implementation.patch'); patch.write_bytes(data)
          subprocess.run(['git','apply','--index','--check','--unidiff-zero',str(patch)],check=True)
          subprocess.run(['git','apply','--index','--unidiff-zero',str(patch)],check=True)
          PY
          git diff --cached --check
          git rm .github/mixer-stage/part-*.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(mixer): integrate native console, one-undo gestures and live send targets'
          git push origin HEAD:refs/heads/codex/mixer-console
          mkdir -p validation
          git rev-parse HEAD | tee validation/revision.txt
          git show --stat --oneline HEAD > validation/change-summary.txt
          git archive --format=tar.gz HEAD > validation/source.tar.gz
      - name: AppKit component tests and real offscreen render
        if: always() && steps.publish.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          bash scripts/test-mixer-ui.sh 2>&1 | tee validation/appkit-tests.log
      - name: Configure and build sanitized core
        id: core
        if: always() && steps.publish.outcome == 'success'
        shell: bash
        run: |
          set -eo pipefail
          cmake --preset sanitizers 2>&1 | tee validation/configure.log
          cmake --build --preset sanitizers -j 2 2>&1 | tee validation/core-build.log
      - name: Full macOS core regression
        if: always() && steps.core.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          ctest --preset sanitizers --output-on-failure 2>&1 | tee validation/ctest.log
      - name: Build complete signed AppKit application
        if: always() && steps.publish.outcome == 'success'
        shell: bash
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
        run: |
          set -eo pipefail
          bash scripts/build-macos.sh 2>&1 | tee validation/app-build.log
          ditto -c -k --sequesterRsrc --keepParent 'build/My DAW.app' validation/My-DAW-app.zip
      - name: Documentation contracts
        if: always() && steps.publish.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/check_docs.py 2>&1 | tee validation/docs.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mixer-native-validation-${{ github.run_id }}
          path: |
            validation/
            build/mixer-ui.png
            build/build-manifest.json
          retention-days: 7
