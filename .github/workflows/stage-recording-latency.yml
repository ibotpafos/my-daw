name: One-shot recording latency source transfer
on:
  push:
    branches: [codex/stage-recording-latency-20260918]
permissions:
  contents: write
jobs:
  transfer:
    if: github.repository == 'ibotpafos/my-daw'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source patch and base
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/latency-source"
          python3 - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          encoded = ''.join(Path(f'.ci-transfer/latency-part-{i}').read_text() for i in range(3))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '68cb5d4221240a14875cd8c772870f8fc865fbe9ace1e8a713460a582d8053fe'
          Path(os.environ['RUNNER_TEMP'], 'latency-source/change.patch').write_bytes(patch)
          PY
          git checkout --detach 51640fac9ce4feb362d4be81d529b2dff9c3699a
          git apply --index "$RUNNER_TEMP/latency-source/change.patch"
          git diff --cached --check
          test "$(git write-tree)" = 76f4629cdc31d00a85cc5972d14761993bd2d463
          test "$(git diff --cached --name-only | wc -l)" -eq 26
          test -z "$(git diff --cached --name-only -- .github .ci-transfer)"
      - name: Format migrated bridge and test production core
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-18 libsamplerate0-dev pkg-config
          clang-format-18 -i engine/bridge/daw.cpp
          git add engine/bridge/daw.cpp
          git diff --cached --check
          cmake -S . -B build/transfer -DCMAKE_BUILD_TYPE=Debug -DDAW_SANITIZERS=ON
          cmake --build build/transfer --parallel 2 --target daw_recording_latency_tests daw_duplex_capture_tests e2e_duplex_recording 2>&1 | tee "$RUNNER_TEMP/latency-source/build.log"
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 ctest --test-dir build/transfer --output-on-failure -R '^(recording_latency|duplex_capture|e2e_duplex_recording)$' 2>&1 | tee "$RUNNER_TEMP/latency-source/tests.log"
          python3 scripts/e2e_coverage.py --strict
      - name: Publish source-only feature commit without force
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 51640fac9ce4feb362d4be81d529b2dff9c3699a
          test "$(git diff --cached --name-only | wc -l)" -eq 26
          test -z "$(git diff --cached --name-only -- .github .ci-transfer)"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          test "$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" ls-remote origin refs/heads/codex/p0-04-recording-latency | cut -f1)" = 51640fac9ce4feb362d4be81d529b2dff9c3699a
          git config user.name ChatGPT
          git config user.email noreply@openai.com
          git commit -m 'feat(recording): timestamp-based latency compensation and safe input-tail drain'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/codex/p0-04-recording-latency
          git rev-parse HEAD > "$RUNNER_TEMP/latency-source/commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/latency-source/tree.txt"
          git archive --format=zip HEAD -o "$RUNNER_TEMP/latency-source/source.zip"
          git diff --binary HEAD^ HEAD > "$RUNNER_TEMP/latency-source/published.patch"
      - name: Preserve exact source and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: recording-latency-source-${{ github.run_id }}
          path: ${{ runner.temp }}/latency-source/
          retention-days: 7
          if-no-files-found: error
