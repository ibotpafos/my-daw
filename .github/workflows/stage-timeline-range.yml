name: Stage timeline range editing
on:
  push:
    branches: ["codex/reference-workspace"]
    paths: [".github/workflows/stage-timeline-range.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Apply checksum-verified standard Git patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, subprocess
          from pathlib import Path
          encoded = ''
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(patch).hexdigest() != 'c37dfad934dd8f0689599630116124060f7786af9e6867788beaad06109fc22f':
              raise SystemExit('Reviewed patch checksum mismatch')
          if subprocess.check_output(['git', 'hash-object', 'apps/macos/main.swift'], text=True).strip() != '9b82a4c511b113d22480d490eca5b99e723d9d46':
              raise SystemExit('Coordinator changed; rebase and review instead of overwriting')
          Path('/tmp/timeline.patch').write_bytes(patch)
          PY
          git apply --check --index /tmp/timeline.patch
          git apply --index /tmp/timeline.patch
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(macos): edit cycle ranges directly and anchor timeline zoom'
          git push origin HEAD:refs/heads/codex/reference-workspace
