name: Apply reviewed MIDI duration fix
on:
  push:
    branches: ["codex/vst3-instrument-source"]
    paths: [".github/workflows/fix-midi-duration-once.yml"]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'ibotpafos/my-daw'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Apply exact reviewed changes, rejecting different source or output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          expected = {
              'engine/bridge/daw.cpp': ('35ca65544defbbe274d6ad0e82c1591ee687d46a', 'd591dfc22f66525c42c98fffc44162d5966d4acd'),
              'tests/midi_bridge_tests.cpp': ('dc13f8bd58ea91f25da48073745be5e97f27c0c7', '21fe6ab579047921fe883d30fcb1f5bfcdc64b0f'),
          }
          def blob(path):
              return subprocess.check_output(['git', 'hash-object', path], text=True).strip()
          for path, (before, _) in expected.items():
              if blob(path) != before:
                  raise SystemExit('Refusing unreviewed input: ' + path)
          p = Path('engine/bridge/daw.cpp')
          s = p.read_text()
          old = '    for (const auto &t : s->model.state().tracks)\n        for (const auto &region : t.regions)\n            frames = std::max(frames, region.start + region.length);\n'
          new = '    for (const auto &t : s->model.state().tracks) {\n        for (const auto &region : t.regions)\n            frames = std::max(frames, region.start + region.length);\n        for (const auto &clip : t.midiClips)\n            frames = std::max(frames, clip.start + clip.length);\n    }\n'
          if s.count(old) != 1:
              raise SystemExit('Expected one duration helper')
          p.write_text(s.replace(old, new))
          p = Path('tests/midi_bridge_tests.cpp')
          s = p.read_text()
          s = s.replace('    daw_midi_note read[4]; uint32_t written=0;', '    auto duration=[&]{ daw_transport t{}; t.struct_size=sizeof(t); CHECK(daw_get_transport(s,&t)==0); return t.duration; };\n    daw_midi_note read[4]; uint32_t written=0;\n    CHECK(duration()==0);')
          s = s.replace('    daw_midi_note empty; uint32_t emptyWritten=7;', '    uint32_t emptyWritten=7;')
          s = s.replace('    CHECK(clipCount()==1);\n    auto out=', '    CHECK(clipCount()==1);\n    // Stopped transport must use the same MIDI duration as the renderer.\n    // These calls never open a physical device and run in the no-SDK CI too.\n    CHECK(duration()==48000);\n    const auto beforeNavigation=revision();\n    CHECK(daw_seek_frame(s,137)==0);\n    CHECK(daw_set_loop(s,1,137,48000)==0);\n    CHECK(daw_set_loop(s,1,137,48001)!=0);\n    CHECK(daw_seek_frame(s,48001)!=0);\n    CHECK(revision()==beforeNavigation);\n    CHECK(daw_set_loop(s,0,0,0)==0);\n    CHECK(daw_seek_frame(s,0)==0);\n    auto out=')
          s = s.replace('    CHECK(revision()==beforeNoop);', '    CHECK(revision()==beforeNoop);\n    CHECK(duration()==58000);\n    CHECK(daw_seek_frame(s,58000)==0);\n    CHECK(daw_seek_frame(s,58001)!=0);\n    CHECK(daw_seek_frame(s,0)==0);')
          s = s.replace('    CHECK(clipCount()==2);', '    CHECK(clipCount()==2);\n    CHECK(duration()==58000);')
          s = s.replace('    // undo restores the trimmed clip and its note; redo trims again', '    CHECK(duration()==10600);\n\n    // undo restores the trimmed clip and its note; redo trims again')
          s = s.replace('    CHECK(daw_redo(s,revision())==0);', '    CHECK(duration()==58000);\n    CHECK(daw_redo(s,revision())==0);\n    CHECK(duration()==10600);')
          s = s.replace('    // stale revision fails without mutation', '    CHECK(duration()==0);\n    CHECK(daw_seek_frame(s,1)!=0);\n    CHECK(daw_set_loop(s,1,0,1)!=0);\n\n    // stale revision fails without mutation')
          s = s.replace('    std::cout<<"PASS: MIDI bridge commands/queries', '    std::cout<<"PASS: MIDI-only stopped transport duration, seek/loop bounds, trim/split/move/Undo/Redo"<<std::endl;\n    std::cout<<"PASS: MIDI bridge commands/queries')
          p.write_text(s)
          for path, (_, after) in expected.items():
              if blob(path) != after:
                  raise SystemExit('Refusing unexpected output: ' + path)
          PY
          git diff --check
          git diff --stat
          git add engine/bridge/daw.cpp tests/midi_bridge_tests.cpp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(midi): include MIDI clips in stopped transport duration and navigation bounds'
          git push origin HEAD:refs/heads/codex/vst3-instrument-source
