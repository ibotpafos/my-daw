name: Prepare reviewed recording clock
on:
  push:
    branches: [codex/stage-recording-clock-20260918]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reproduce exact tested patch and publish a new feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base=f943a7bc455031091ba249f01150078964de8321
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git diff --name-only "$base" HEAD)" = .github/workflows/stage-recording-clock.yml
          chunks=(c5d2e156bcb1bb28a97438c747a7dff605d2d1e1 fa883e79151d2f628dcc3b555ef822d7570c0356)
          for index in "${!chunks[@]}"; do
            curl --fail --silent --show-error --retry 2 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/ibotpafos/my-daw/git/blobs/${chunks[$index]}" -o "$RUNNER_TEMP/clock-part-$index.json"
          done
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          data = b''.join(base64.b64decode(json.loads((root / f'clock-part-{i}.json').read_text())['content']) for i in range(2))
          assert hashlib.sha256(data).hexdigest() == '6f08cd43f5d9fe6cf71e9476b9740059b5c860e5d73c7dee523a91acad76fe15'
          (root / 'clock.patch').write_bytes(lzma.decompress(data))
          PY
          git read-tree --reset -u "$base"
          git apply --index --unidiff-zero "$RUNNER_TEMP/clock.patch"
          test "$(git write-tree)" = f0494a672ab0fc9bf89b458e303b8a17781ec21a
          test ! -e .github/workflows/stage-recording-clock.yml
          git diff --cached --check
          git diff --cached "$base" --exit-code -- .github
          clang-format-18 --dry-run --Werror engine/bridge/daw.cpp
          python3 -m unittest discover -s tests -p test_project_layout.py -v
          python3 scripts/e2e_coverage.py --strict
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tree=$(git write-tree)
          head=$(git commit-tree "$tree" -p "$base" -m 'fix(audio): reject discontinuous recording clocks and preserve the confirmed prefix')
          branch=codex/recording-clock-continuity
          test -z "$(git ls-remote origin "refs/heads/$branch")"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "$head:refs/heads/$branch"
          mkdir -p build/clock-source
          git archive --format=zip "$head" -o build/clock-source/source.zip
          printf '%s\n' "$head" "$tree" > build/clock-source/revision.txt
          sha256sum build/clock-source/source.zip > build/clock-source/SHA256SUMS
          echo "Published $head with exact tree $tree; main not changed; full PR CI is still required."
      - name: Preserve published source evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: recording-clock-source-${{ github.run_id }}
          path: build/clock-source/
          if-no-files-found: error
          retention-days: 7
