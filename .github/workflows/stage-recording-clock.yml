name: One-shot recording clock source transfer
on:
  push:
    branches: [codex/stage-recording-clock-integrity]
permissions:
  contents: write
jobs:
  transfer:
    if: github.repository == 'ibotpafos/my-daw'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify and apply exact tested source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clock-source"
          python3 - <<'PY'
          import hashlib, lzma, os
          from pathlib import Path
          patch = lzma.decompress(Path('.ci-transfer/recording-clock.patch.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == '32f69df5414c4ef7ea1bcbc161f3cba2c3a58c4f429b4153c13c905bb70fe040'
          Path(os.environ['RUNNER_TEMP'], 'clock-source/change.patch').write_bytes(patch)
          PY
          git checkout --detach f943a7bc455031091ba249f01150078964de8321
          git apply --index "$RUNNER_TEMP/clock-source/change.patch"
          git diff --cached --check
          test "$(git write-tree)" = fb90ff5508d9fca52dfe5a47eea43f1c210ebcfa
          test -z "$(git diff --cached --name-only -- .github .ci-transfer)"
          clang++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-sanitize-recover=undefined -Iengine tests/recording_clock_tests.cpp -o "$RUNNER_TEMP/clock-tests"
          "$RUNNER_TEMP/clock-tests" | tee "$RUNNER_TEMP/clock-source/tests.log"
      - name: Publish source-only feature branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f943a7bc455031091ba249f01150078964de8321
          test "$(git write-tree)" = fb90ff5508d9fca52dfe5a47eea43f1c210ebcfa
          git config user.name ChatGPT
          git config user.email noreply@openai.com
          git commit -m 'fix(recording): reject discontinuous callback timestamps and preserve recovery'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/codex/recording-clock-integrity
          git rev-parse HEAD > "$RUNNER_TEMP/clock-source/commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/clock-source/tree.txt"
          git archive --format=zip HEAD -o "$RUNNER_TEMP/clock-source/source.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: recording-clock-source-${{ github.run_id }}
          path: ${{ runner.temp }}/clock-source/
          retention-days: 7
          if-no-files-found: error
